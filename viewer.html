<!doctype html><html lang="pl"><meta charset="utf-8"><title>Karambit — oryginalne animacje</title><script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script><style>body{margin:0;background:#68747a;color:white;font:13px Arial}canvas{position:fixed;inset:0}nav{position:fixed;top:12px;left:12px;z-index:3;display:flex;gap:7px;flex-wrap:wrap}button,select{padding:8px}#status{position:fixed;bottom:12px;left:12px;z-index:2}a{color:white}</style><canvas id="view"></canvas><nav><button id="draw">Wyciągnij</button><button id="inspect">F — inspekcja</button><button id="slash">LPM — cięcie</button><button id="stab">PPM — pchnięcie</button><select id="clips" aria-label="Sekwencja"></select><button id="pause">Pauza</button><a href="/">Wróć do gry</a></nav><div id="status">Wczytywanie oryginalnego modelu…</div><script type="module">
import * as THREE from 'three';import {Karambit} from './karambit.mjs';const r=new THREE.WebGLRenderer({canvas:document.getElementById('view'),antialias:true});r.setClearColor(0x68747a);r.setPixelRatio(devicePixelRatio);const k=new Karambit();let paused=false,last=performance.now();function resize(){r.setSize(innerWidth,innerHeight);k.resize(innerWidth,innerHeight)}resize();addEventListener('resize',resize);await k.load();for(const c of k.data.animation.clips){const o=document.createElement('option');o.textContent=c.name;o.value=c.name;document.getElementById('clips').append(o)}k.play('idle1');document.getElementById('clips').onchange=e=>k.play(e.target.value,false);document.getElementById('draw').onclick=()=>k.deploy();document.getElementById('inspect').onclick=()=>k.inspect();document.getElementById('slash').onclick=()=>k.attack(false,false);document.getElementById('stab').onclick=()=>k.attack(true,false);document.getElementById('pause').onclick=()=>{paused=!paused};function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused)k.update(dt);r.clear();k.render(r);document.getElementById('status').textContent=k.clip.name+' · '+k.time.toFixed(2)+' s / '+k.clip.duration.toFixed(2)+' s · oryginalne klatki 30 FPS';}requestAnimationFrame(frame);
